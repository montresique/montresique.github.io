function report8(win,earned){const rows=[];let best=-1,bs=-1,lost=0,elost=0,kills=0;const rp=B.rp||{dm:[],kl:[]},d=Math.floor(P.cq.day);let tt='';
 B.sq.forEach((q,i)=>{if(q.side){const l=q.max-q.n;lost+=l;kills+=rp.kl[i]||0;const sc=(rp.kl[i]||0)*3+(rp.dm[i]||0)/60;if(sc>bs){bs=sc;best=i}
   rows.push('<tr><td>'+q.u.name+'</td><td>'+q.n+'/'+q.max+'</td><td>'+l+'</td><td>'+(rp.kl[i]||0)+'</td><td>'+Math.round(rp.dm[i]||0)+'</td></tr>');
   const f=l/q.max;if(f>=.5&&!B.sim){const days=Math.round(3+8*f),cost=Math.round((20+25*q.u.tier)*(.5+f)),o=P.woun[q.u.id];P.woun[q.u.id]={u:Math.max(d+days,o&&o.u>d?o.u:0),c:cost}}}
  else elost+=q.max-q.n});
 const ban=B.ban||0,gk=rp.gk,gl=rp.gl;let coins=0,xp=0;const parts=[];
 if(win){coins+=ban*(14+10*(P.cq.rk||0));xp+=ban*3;if(ban)parts.push(ban+' captured banner'+(ban>1?'s':'')+' (+'+coins+' coins)');if(gk){const b=40+10*(B.c&&B.c.power||1);coins+=Math.round(b);parts.push('enemy general slain (+'+Math.round(b)+' coins)')}
  if(gl){const pen=Math.round(earned*.2);coins-=pen;parts.push('your general fell (-'+pen+' coins)')}}
 if(coins)P.coins=Math.max(0,P.coins+coins);if(xp)P.xp+=xp;
 const h='<section class="rp"><table class="st"><tr><th>Squad</th><th>Men</th><th>Lost</th><th>Kills</th><th>Damage</th></tr>'+rows.join('')+'</table>'
 +(best>=0?'<small>★ Best squad: <b>'+B.sq[best].u.name+'</b> ('+(rp.kl[best]||0)+' kills, '+Math.round(rp.dm[best]||0)+' damage)</small><br>':'')
 +'<small>You lost '+lost+' men, they lost '+elost+'. '+(parts.length?'Spoils: '+parts.join('; ')+'. ':'')+((B.mr||0)?'Squads routed: '+B.mr+'. ':'')+((B.ffk||0)?'Friendly-fire hits: '+B.ffk+'. ':'')+'</small>'+woundHTML()+'</section>';
 return{html:h,txt:parts.length?' '+parts.join(', ')+'.':''}}
function end(win){if(!B||B.over)return;B.over=1;if(B.sim){B.win=win;return}rainBed(0);hintHide();const c0=P.coins,r=settle(win,B),rp=report8(win,Math.max(0,P.coins-c0));save();hud();
 $('ot').textContent=r[0];$('op').textContent=r[1]+rp.txt;$('orp').innerHTML=rp.html;$('over').style.display='flex'}
function closeOver(){$('over').style.display='none';rainBed(0);hintHide();HQ.length=0;if(B){if(B.army&&B.army.fb==-1)delete B.army.fb;if(B.foe&&B.foe.fb==-1)delete B.foe.fb}B=null;render()}
const US=[[.9,'S'],[1,'M'],[1.15,'L'],[1.3,'XL']];
function applyUS(){document.documentElement.style.setProperty('--us',P.set.us||1)}
function setUI8(){const tg=k=>'<button class="'+(P.set[k]!==0?'g':'')+'" onclick="P.set.'+k+'=P.set.'+k+'===0?1:0;save();render()">'+(P.set[k]!==0?'On':'Off')+'</button>',row=(t,d,b)=>'<div class="pr"><span style="flex:1"><b>'+t+'</b><br><small>'+d+'</small></span>'+b+'</div>';
 return row('Sound','Procedural hits, arrows, horns, charge thunder and rain. Starts after your first tap on the screen.',tg('sd'))
 +row('Volume','Master volume for battle sounds.',[[.25,'Low'],[.5,'Med'],[.9,'High']].map(x=>'<button class="'+((P.set.sv||.5)==x[0]?'on':'')+'" onclick="P.set.sv='+x[0]+';save();render()">'+x[1]+'</button>').join(''))
 +row('Tutorial hints','A short tip the first time each mechanic appears in battle.',tg('ht')+'<button onclick="P.hint={};save();render()">Reset</button>')
 +row('Minimap','Small map in the battle corner. Tap or drag on it to move the camera.',tg('mm'))
 +row('Battle weather','Rain, fog, wind, snow, dusk and night change sight, range and speed. Off makes every battle clear daylight.',tg('wx'))
 +row('UI scale','Scales menus and battle panels.',US.map(x=>'<button class="'+((P.set.us||1)==x[0]?'on':'')+'" onclick="P.set.us='+x[0]+';save();applyUS();render()">'+x[1]+'</button>').join(''))}
function init8(){const M=B.map;B.pre=1;B.cam={x:450,y:216,s:1};B.fcs=0;B.cdS=0;B.cdF=0;B.farr=0;B.ban=0;
 B.sq.forEach(q=>{q.pwr=0});for(const u of B.un){const q=B.sq[u.sq];q.pwr+=(u.mhp+u.sh)*u.dmg/200}
 B.rp={dm:B.sq.map(()=>0),kl:B.sq.map(()=>0),sw:0,gk:0,gl:0};
 weather8(B.b,B.c||{id:1});fireInit();genInit();mmBake()}
